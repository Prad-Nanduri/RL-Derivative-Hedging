[project]
name = "deep-hedging-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium==1.3.0",
    "stable-baselines3==2.9.0",
    "arch==8.0.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.53",
    "scipy==1.17.1",
    "numpy==2.4.6",
    "torch==2.9.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
